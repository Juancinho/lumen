[package]
name = "lumen-bench"
description = "Lumen benchmark harness (release-mode, machine-readable). Not shipped."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "lumen-bench"
path = "src/main.rs"

[[example]]
name = "images"
required-features = ["ort"]

[[example]]
name = "image_gpu"
required-features = ["directml"]

[features]
default = []
# ONNX Runtime backend (`--backend ort`); runtime loaded from --ort-dylib at startup.
ort = ["dep:lumen-embedding-ort"]
# DirectML devices (`--device dml:N`, Windows, onnxruntime-directml build).
directml = ["ort", "lumen-embedding-ort/directml"]
# Real token counts for `chunk --tokenizer tokenizer.json`.
tokenizer = ["dep:tokenizers"]

[dependencies]
lumen-core.workspace = true
lumen-embedding.workspace = true
lumen-embedding-ort = { workspace = true, optional = true }
lumen-vector.workspace = true
lumen-storage.workspace = true
lumen-indexer.workspace = true
lumen-catalog.workspace = true
lumen-extract.workspace = true
lumen-content.workspace = true
lumen-semantic.workspace = true
lumen-search.workspace = true
tokenizers = { workspace = true, optional = true }
usearch.workspace = true
memory-stats.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
# Process CPU time for throughput runs (T014).
lumen-windows.workspace = true

[lints]
workspace = true

[dev-dependencies]
lumen-image.workspace = true
lopdf.workspace = true
