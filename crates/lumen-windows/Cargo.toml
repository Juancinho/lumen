[package]
name = "lumen-windows"
description = "Windows OS adapters (no GUI framework/WebView types): Start-menu application catalog (T101), window material/DWM (T004), process CPU time (T014)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "UI_ViewManagement",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
windows-core = "0.62.2"
# Same version as window-vibrancy (Cargo.lock); RtlGetVersion, so no manifest dependence.
windows-version = "0.1.7"

[lints]
workspace = true
