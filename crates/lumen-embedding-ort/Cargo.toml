[package]
name = "lumen-embedding-ort"
description = "ONNX Runtime EmbeddingBackend for EmbeddingGemma 2 (CPU; DirectML on Windows). Runtime loaded dynamically."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# DirectML execution provider (Windows; needs the onnxruntime-directml build of onnxruntime.dll).
directml = ["ort/directml"]

[dependencies]
