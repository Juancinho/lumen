[workspace]
resolver = "3"
members = ["crates/lumen-core", "crates/lumen-embedding", "crates/lumen-embedding-ort", "crates/lumen-vector", "crates/lumen-storage", "crates/lumen-indexer", "crates/lumen-windows", "crates/lumen-catalog", "crates/lumen-search", "crates/lumen-extract", "crates/lumen-content", "crates/lumen-semantic", "crates/lumen-provision", "crates/lumen-bench", "apps/desktop/src-tauri", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

# Single source of truth for dependency versions. Members opt in with `dep.workspace = true`.
[workspace.dependencies]
lumen-core = { path = "crates/lumen-core" }
lumen-embedding = { path = "crates/lumen-embedding" }
lumen-embedding-ort = { path = "crates/lumen-embedding-ort" }
lumen-vector = { path = "crates/lumen-vector" }
lumen-storage = { path = "crates/lumen-storage" }
lumen-indexer = { path = "crates/lumen-indexer" }
lumen-windows = { path = "crates/lumen-windows" }
lumen-search = { path = "crates/lumen-search" }
lumen-extract = { path = "crates/lumen-extract" }
lumen-catalog = { path = "crates/lumen-catalog" }
lumen-content = { path = "crates/lumen-content" }
lumen-semantic = { path = "crates/lumen-semantic" }
lumen-provision = { path = "crates/lumen-provision" }
unicode-normalization = "0.1.24"
memory-stats = "1.2.0"
# SQLite canonical store (ADR-003). Bundled: same SQLite (with FTS5) on every machine.
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
# Stable file identity: volume serial + NTFS file id (Windows), dev + inode (Unix).
file-id = "0.2.3"
# HNSW ANN (ADR-004). C++ core compiled by cargo (MSVC on Windows).
usearch = "=2.26.4"
# ONNX Runtime loaded dynamically (onnxruntime.dll shipped next to the exe); API level 24 so the
# DirectML build (frozen at ORT 1.24) and newer CPU builds both load. See ADR-015.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-24"] }
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.12.1", features = ["tray-icon"] }
tauri-build = { version = "2.7.1", features = [] }
tauri-plugin-global-shortcut = "2.4.0"
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-opener = "2.7.0"
tauri-plugin-dialog = "2"
arboard = { version = "3.6.1", default-features = false }

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
print_stdout = "warn"
large_futures = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# Release optimisations with symbols, for profilers/flamegraphs (see docs/DEVELOPMENT.md).
[profile.profiling]
inherits = "release"
debug = true
strip = false
