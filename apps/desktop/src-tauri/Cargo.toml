[package]
name = "lumen-desktop"
description = "Lumen desktop presentation shell (Tauri 2). Thin adapters only: no domain logic lives here."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "lumen"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
lumen-core.workspace = true
lumen-storage.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-single-instance.workspace = true

[target.'cfg(windows)'.dependencies]
# Same versions as wry/tauri (Cargo.lock): the controller type comes from tauri's PlatformWebview.
webview2-com = "0.39.1"
windows-core = "0.62.2"

[lints]
workspace = true
